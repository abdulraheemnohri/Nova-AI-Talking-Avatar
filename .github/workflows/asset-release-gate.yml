name: Asset release gate tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-asset-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release-gate unit tests
        run: python -m unittest discover -s tests -v
      - name: Check release-gate CLI help
        run: python tools/verify_asset_release.py --help
