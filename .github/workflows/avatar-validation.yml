name: Nova avatar validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glb-audit-tests:
    name: Python GLB audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit tool and tests
        run: python -m py_compile tools/audit_glb.py tests/test_audit_glb.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  android-unit-tests:
    name: Android JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android JVM unit tests
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.13"
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon testDebugUnitTest
