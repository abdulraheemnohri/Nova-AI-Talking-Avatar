name: Nova avatar validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glb-audit-tests:
    name: Python GLB audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit tool and tests
        run: python -m py_compile tools/audit_glb.py tests/test_audit_glb.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android JVM unit tests
        run: ./gradlew testDebugUnitTest
